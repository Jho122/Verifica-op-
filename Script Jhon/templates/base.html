<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Redes{% endblock %}</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Arquivo de estilos personalizados -->
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Barra de navegação superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-nav px-4">
        <div class="container-fluid">
            <!-- Título do projeto à esquerda -->
            <a class="navbar-brand" href="#">Sistema de Redes</a>
            
            <!-- Nome do usuário e botão de logout à direita -->
            <span class="navbar-text ms-auto">
                Bem-vindo, {{ username }}
            </span>
            <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm ms-3">Logout</a>
        </div>
    </nav>

    <div class="d-flex">
        <!-- Menu lateral -->
        <nav class="sidebar" style="width: 200px; height: 100vh;">
            <h5 class="text-center mt-3">Menu</h5>
            <ul class="nav flex-column p-2">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Firewall</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/fortinet' %}active{% endif %}" href="{{ url_for('fortinet') }}">Fortinet</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" tabindex="-1" aria-disabled="true">Palo Alto</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" tabindex="-1" aria-disabled="true">Router</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" tabindex="-1" aria-disabled="true">Switch</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" tabindex="-1" aria-disabled="true">APIC</a>
                </li>
            </ul>
        </nav>

        <!-- Conteúdo principal -->
        <div class="flex-grow-1 p-4">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
